[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hair-omakase-mcp"
version = "1.0.0"
description = "AI Hair Consulting MCP Server for PlayMCP"
readme = "MCP_README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
hair-omakase = "mcp_server:mcp.run"
